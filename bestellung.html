<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bestellung</title>
</head>
<body><form><h1>Takeaway-Bestellung</h1>
<img src="https://play-lh.googleusercontent.com/y6v4KOQk3GRmbYx4klvOzH_Njln09BdVxIEpYJvOkgWXd5fD30hQ4h-xQSfGB7O70gOGblA69VGg03Qap7it">
<br><label for="Zutaten">Standart</label><select size="1" multiple id="Zutaten">
           <option value="Käse">Käse</option>
           <option value="Salat">Salat</option>
           <option value="Soße">Soße</option>
    </select>
<br>
    <label for="Pommes">Pommes:</label>
<select id="Pommes">
    <option value="große Portion">große Portion</option>
    <option value="kleine Portion"> kleine Portion</option>
    <option value="keine">Keine</option>
</select>
<br>
    <p>Fleisch:</p>
<input type="radio" id="150g" name="g" value="150g">
<label for="150g">150g</label>
<input type="radio" id="200g" name="g" value="200g">
<label for="200g">200g</label>
<input type="radio" id="300g" name="g" value="300g">
<label for="300g">300g</label>

<br>
    <p>Käse:</p>
<input type="radio" id="150g" name="g" value="150g">
<label for="150g">Cheddar</label>
<input type="radio" id="200g" name="g" value="200g">
<label for="200g">Mozzarella</label>
<input type="radio" id="300g" name="g" value="300g">
<label for="300g">Bergkäse</label>

<br>
<p>Extras:</p>
<input type="checkbox" id="150g" name="g" value="150g">
<label for="150g">Jalapenos</label>
<input type="checkbox" id="200g" name="g" value="200g">
<label for="200g">Speck</label>
<input type="checkbox" id="300g" name="g" value="300g">
<label for="300g">Champignons</label>

<br>
<p>Name:</p>
<input type="name">

<br>
<p>Abholzeit</p>
<input type="time">
    <button>Bestellen!</button>
</form>

</body>
</html>
